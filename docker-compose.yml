services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fieldassist
      POSTGRES_USER: fieldassist
      POSTGRES_PASSWORD: fieldassist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldassist -d fieldassist"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
